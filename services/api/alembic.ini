; Alembic configuration for the metadata store (work package A01).
;
; The database URL is deliberately absent: env.py resolves it through app.db.database_url() from
; BB_DATABASE_URL, BB_TEST_DATABASE_URL, or the BB_DB_* locator plus the password secret
; file. A URL in this file would be a secret in the repository.
;
; Run from services/api:
;
;   alembic upgrade head        ; what the compose `migrate` one-shot service runs (O01)
;   alembic downgrade base      ; every revision ships a tested downgrade
;   alembic history             ; exactly one revision at A01
;   alembic current

[alembic]
script_location = alembic
prepend_sys_path = .
; Alembic 1.19 requires this to be explicit rather than splitting on spaces and colons.
path_separator = os
file_template = %%(rev)s_%%(slug)s
; Revision ids are ordered, zero-padded integers, so `alembic history` reads chronologically.
truncate_slug_length = 40
; Timestamps in migration headers are UTC, matching the log and audit timestamps.
timezone = UTC

; No post-write hooks: a revision is reviewed and formatted by hand, and `ruff check
; services/api` covers it like the rest of the package.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
