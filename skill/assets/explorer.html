*{box-sizing:border-box;letter-spacing:0}html,body{height:100%;margin:0;overflow:hidden}body{font:14px/1.45 'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--line);border-radius:5px;background:var(--panel)}button{cursor:pointer;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px}button:hover{background:var(--raised);border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select{width:100%;min-width:0;height:34px;padding:5px 8px}input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}label{font-size:12px;color:var(--muted);display:grid;gap:4px;min-width:0}h1,h2,h3,p{margin:0}h1{font-size:20px;font-weight:650}h2{font-size:17px}h3{font-size:14px}svg.icon{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconbtn{width:34px;height:34px;padding:7px;flex:none}.app{height:100dvh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto}.top{padding:12px 18px;display:flex;align-items:center;gap:16px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{min-width:0}.subtitle,.muted{color:var(--muted);font-size:12px}.subtitle{margin-top:2px}.top-actions{display:flex;gap:8px;margin-left:auto;align-items:center}.theme{display:flex;align-items:center;gap:6px}.theme select{width:90px}.tabs{display:flex;padding:0 18px;gap:20px;background:var(--panel);border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent;padding:11px 0;white-space:nowrap;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}.filters{display:grid;grid-template-columns:minmax(170px,1.5fr) minmax(140px,1fr) minmax(140px,1fr) auto;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:end}.filter-actions{display:flex;gap:6px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;min-width:0}.workspace.no-side{grid-template-columns:minmax(0,1fr)}.content{min-height:0;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.view-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}.view-tools select{width:auto;max-width:220px}.view-tools .push{margin-left:auto}.check{display:flex;align-items:center;gap:6px}.stage{min-height:0;overflow:auto;position:relative;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}.stage #graph{display:block;max-width:none}.graph-wrap{min-width:100%;min-height:100%}.graph-node{cursor:pointer}.graph-node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.3}.graph-node.selected rect{stroke:var(--accent);stroke-width:2.5}.graph-node .name{fill:var(--ink);font:600 13px 'Segoe UI',Arial,sans-serif}.graph-node .meta,.domain-label{fill:var(--muted);font:12px 'Segoe UI',Arial,sans-serif}.graph-node .key{fill:var(--muted);font:11px Consolas,monospace}.graph-node .stripe{stroke-width:3}.edge{fill:none;stroke:var(--edge);stroke-width:1.2;opacity:.48}.edge.inferred{stroke-dasharray:5 4}.edge.active{stroke:var(--accent);stroke-width:2.2;opacity:1}.domain-label{font-weight:650;font-size:14px}.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.legend i{display:inline-block;width:20px;border-top:2px solid var(--accent)}.legend .dash{border-top-style:dashed}.data-scroll{min-height:0;overflow:auto;background:var(--panel)}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:var(--raised);z-index:1;text-align:left;color:var(--muted);font-size:12px;font-weight:600}th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}td{overflow-wrap:anywhere}tr.selected td{background:var(--soft)}tbody tr:hover td{background:var(--raised)}.data-scroll table{min-width:840px}.data-scroll td:first-child{max-width:270px}.table-link{display:inline;padding:0;border:0;min-height:0;border-radius:0;background:transparent;text-align:left;overflow-wrap:anywhere;color:var(--accent);font-weight:600}.table-link:hover{background:transparent;text-decoration:underline}.tag{display:inline-block;color:var(--muted);font-size:11px;padding:2px 5px;background:var(--raised);border:1px solid var(--line);border-radius:4px;margin:1px 2px 1px 0;white-space:normal}.tag.good{color:var(--accent)}.side{background:var(--panel);border-left:1px solid var(--line);min-width:0;min-height:0;overflow:auto}.side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}.detail{padding:14px;display:grid;gap:16px}.detail h2{overflow-wrap:anywhere}.detail h3{margin-bottom:7px}.detail p{font-size:13px;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 10px;font-size:12px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.detail-table{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:4px}.detail-table table{table-layout:fixed}.detail-table th,.detail-table td{padding:7px;font-size:12px}.detail-table th:first-child{width:47%}.detail-actions{display:flex;gap:6px;flex-wrap:wrap}.detail section{min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace;background:var(--bg);padding:12px;border:1px solid var(--line);border-radius:4px;margin:8px 0}.notice{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:8px 10px;background:var(--raised)}.empty{padding:32px;color:var(--muted);text-align:center}.footer{display:flex;gap:12px;justify-content:space-between;padding:6px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);background:var(--panel)}.footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:8px 14px;background:var(--ink);color:var(--bg);border-radius:5px;z-index:10}.hidden,[hidden]{display:none!important}.comparison{padding:16px;border-bottom:1px solid var(--line);background:var(--soft)}.comparison h3{margin-bottom:8px}.review-metric{color:var(--muted);font-size:12px}.tooltip{position:fixed;background:var(--ink);color:var(--bg);padding:5px 8px;font-size:12px;z-index:50;border-radius:4px;pointer-events:none;max-width:220px}
@media(min-width:1800px){.workspace{grid-template-columns:minmax(0,1fr) 400px}}
@media(max-width:1050px){.workspace{grid-template-columns:minmax(0,1fr) 310px}.filters{grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) minmax(120px,1fr) auto}.tabs{gap:16px}.top{padding:10px 14px}}
@media(max-width:700px){.top{padding:9px 12px;gap:8px}h1{font-size:17px}.subtitle{font-size:11px}.top-actions{gap:4px}.theme{gap:0}.theme select{width:78px;font-size:12px}.top-actions>.iconbtn{display:none}.tabs{padding:0 12px;gap:18px}.tabs button{font-size:12px}.tabs .icon{display:none}.filters{padding:8px 12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 8px}.filters label:first-child{grid-column:1/-1}.filter-actions{align-self:end}.workspace{position:relative;grid-template-columns:minmax(0,1fr)}.side{position:absolute;inset:0 0 0 auto;width:min(360px,100%);z-index:5;box-shadow:-12px 0 30px #0004}.view-tools{padding:7px 12px;gap:7px}.view-tools select{max-width:170px;font-size:12px}.footer{padding:5px 12px}.footer span:last-child{display:none}.legend{font-size:11px}.data-scroll table{min-width:760px}}

<body>
<div class="app">
  <header class="top"><div class="brand"><h1>__PROJECT_HTML__</h1><div class="subtitle">Backend Buddy &middot; schema explorer</div></div><div class="top-actions"><label class="theme"><span class="sr" hidden>Theme</span><select id="theme" aria-label="Color theme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></label><button class="iconbtn" id="export" aria-label="Export current view as CSV" data-tip="Export current view as CSV" data-icon="Download"></button></div></header>
  <nav class="tabs" role="tablist" aria-label="Schema views"><button role="tab" id="tab-map" data-view="map" aria-controls="content" aria-selected="true"><i data-icon="Network"></i>Relational map</button><button role="tab" id="tab-entities" data-view="entities" aria-controls="content" aria-selected="false"><i data-icon="List"></i>Entity index</button><button role="tab" id="tab-keys" data-view="keys" aria-controls="content" aria-selected="false"><i data-icon="KeyRound"></i>PK / FK index</button><button role="tab" id="tab-review" data-view="review" aria-controls="content" aria-selected="false"><i data-icon="ScanLine"></i>Normalization review</button><button role="tab" id="tab-fanout" data-view="fanout" aria-controls="content" aria-selected="false"><i data-icon="Network"></i>Row fan-out</button><button role="tab" id="tab-columns" data-view="columns" aria-controls="content" aria-selected="false"><i data-icon="List"></i>Column Table</button><button role="tab" id="tab-city" data-view="city" aria-controls="content" aria-selected="false"><i data-icon="Focus"></i>Schema City</button><button role="tab" id="tab-living" data-view="living" aria-controls="content" aria-selected="false">Living ERD</button><button role="tab" id="tab-lens" data-view="lens" aria-controls="content" aria-selected="false">Normalization Lens</button><button role="tab" id="tab-diff" data-view="diff" aria-controls="content" aria-selected="false">Schema Diff</button><button role="tab" id="tab-matrix" data-view="matrix" aria-controls="content" aria-selected="false">Join Matrix</button><button role="tab" id="tab-arcs" data-view="arcs" aria-controls="content" aria-selected="false">Arc Diagram</button><button role="tab" id="tab-domains" data-view="domains" aria-controls="content" aria-selected="false">Domains</button></nav>
  <div class="filters"><label>Search schema<input id="search" type="search" placeholder="Table, model, column, relationship..."></label><label>Domain<select id="domain"><option value="">All domains</option></select></label><label>Entity type<select id="entityType"><option value="">All entity types</option></select></label><div class="filter-actions"><button id="reset" class="iconbtn" aria-label="Reset filters" data-tip="Reset filters" data-icon="RotateCcw"></button><button id="toggleSide" class="iconbtn" aria-label="Toggle inspector" data-tip="Toggle inspector" data-icon="PanelRightClose"></button></div></div>
  <main class="workspace" id="workspace"><section id="content" class="content" role="tabpanel" aria-labelledby="tab-map"></section><aside class="side" id="side"><div class="side-head"><strong id="inspectorTitle">Entity inspector</strong><button class="iconbtn" id="closeSide" aria-label="Close inspector" data-icon="X"></button></div><div id="detail" class="detail"></div></aside></main>
  <footer class="footer"><span id="status" role="status"></span><span id="provenance"></span></footer>
</div><div id="toast" class="toast" role="status" hidden></div><div id="tooltip" class="tooltip" hidden></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), data = JSON.parse($('schema-data').textContent), icons = JSON.parse($('icon-data').textContent);
const E = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readStored = (k,fallback) => {try{return JSON.parse(localStorage.getItem(k)) ?? fallback;}catch{return fallback;}};
const save = (k,v) => {try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{return false;}};
const state = {view:'map',selected:data.tables[0]?.id || null,finding:null,zoom:1,focus:false,linkKind:'all',keyKind:'all',rule:'all',category:'Normalization',reviewStatus:'open',sort:'name',compare:new Set(),side:innerWidth>700};
let exportRows=[], positions=new Map(), graphSize={w:1,h:1}, drawTimer, toastTimer;
const storagePrefix='backend-buddy:'+data.project.key;
const reviews=readStored(storagePrefix+':reviews',{}), byId=new Map(data.tables.map(t=>[t.id,t]));
const colors={'Core master entity':'var(--blue)','Transaction / operational':'var(--orange)','Association / detail':'var(--green)','Configuration / reference':'var(--purple)','Audit / integration state':'var(--red)'};
const cols=t=>t.allColumns, pk=t=>cols(t).filter(c=>c.pk), relationKey=l=>`${l.source}.${l.column}->${l.target}.${l.targetColumn}`;
const uniqueGroups=t=>[t.primaryKey||pk(t).map(c=>c.name),...t.uniques.filter(u=>!u.partial&&!u.expression).map(u=>u.columns),...t.indexes.filter(i=>i.unique&&!i.partial&&!i.expression).map(i=>i.columns)].filter(a=>a.length);
const indexed=(t,c)=>c.index||c.unique||uniqueGroups(t).some(g=>g[0]===c.name)||t.indexes.some(i=>!i.partial&&!i.expression&&i.columns[0]===c.name);
const outgoing=t=>data.links.filter(l=>l.source===t.id), incoming=t=>data.links.filter(l=>l.target===t.id);
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${(icons[name]||[]).map(([tag,attrs])=>`<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${E(v)}"`).join(' ')}></${tag}>`).join('')}</svg>`;}
function hydrate(){document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon);el.removeAttribute('data-icon');});}
const button=(id,name,tip)=>`<button id="${id}" class="iconbtn" aria-label="${E(tip)}" data-tip="${E(tip)}">${icon(name)}</button>`;
const ref=(table,label=table)=>`<button class="table-link" data-table="${E(table)}">${E(label)}</button>`;
const badge=(text,good=false)=>`<span class="tag ${good?'good':''}">${E(text)}</span>`;
const options=(items,selected,first='All')=>`<option value="all">${first}</option>`+items.map(x=>`<option value="${E(x)}" ${selected===x?'selected':''}>${E(x)}</option>`).join('');
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
function theme(){document.documentElement.dataset.theme=$('theme').value==='system'?(systemTheme.matches?'dark':'light'):$('theme').value;}
$('theme').value=readStored(storagePrefix+':theme','dark');theme();systemTheme.addEventListener('change',theme);
$('theme').onchange=()=>{theme();save(storagePrefix+':theme',$('theme').value);};
['domain','entityType'].forEach((id,i)=>{$(id).insertAdjacentHTML('beforeend',[...new Set(data.tables.map(t=>i?t.type:t.domain))].sort().map(v=>`<option>${E(v)}</option>`).join(''));});
$('provenance').textContent=`Schema snapshot ${data.source.commit.slice(0,8)} | ${data.tables.length} tables | ${data.tables.reduce((n,t)=>n+cols(t).length,0).toLocaleString()} columns`;
$('provenance').title=data.source.basis;
function scoped(){const q=$('search').value.trim().toLowerCase();return data.tables.filter(t=>(!$('domain').value||t.domain===$('domain').value)&&(!$('entityType').value||t.type===$('entityType').value)&&(!q||[t.id,t.className,t.domain,t.type,...cols(t).map(c=>c.name)].join(' ').toLowerCase().includes(q)));}
function setSide(show){state.side=show;$('side').hidden=!show;$('workspace').classList.toggle('no-side',!show);$('toggleSide').removeAttribute('data-icon');$('toggleSide').innerHTML=icon(show?'PanelRightClose':'PanelRightOpen');}
$('toggleSide').onclick=()=>{setSide(!state.side);if(state.view==='map')render();};$('closeSide').onclick=()=>{setSide(false);if(state.view==='map')render();};
function selectTable(id){if(!byId.has(id))return;state.selected=id;state.finding=null;setSide(true);detail();if(state.view==='map')render();else highlight();}
function selectTables(ids){const tables=[...new Set(ids)].map(id=>byId.get(id)).filter(Boolean);if(!tables.length)return;selectTable(tables[0].id);if(tables.length>1){$('inspectorTitle').textContent='Relationship inspector';$('detail').insertAdjacentHTML('afterbegin',tables.slice(1).map(t=>`<details open><summary><strong>${E(t.id)}</strong></summary><p class="muted">PK: ${E(t.pk||'None recorded')}</p><div class="detail-table">${tableHTML(['Column','Type'],cols(t).map(c=>`<tr><td>${E(c.name)} ${c.pk?badge('PK'):''}${c.fk?badge('FK'):''}</td><td>${E(c.type)}</td></tr>`))}</div></details>`).join(''));}}
function highlight(){document.querySelectorAll('tr[data-row]').forEach(r=>r.classList.toggle('selected',r.dataset.row===state.selected));}
function setView(view){state.view=view;document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===view;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;});$('content').setAttribute('aria-labelledby','tab-'+view);render();}
document.querySelectorAll('[data-view]').forEach((b,i,all)=>{b.onclick=()=>setView(b.dataset.view);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?all.length-1:(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length;all[n].focus();setView(all[n].dataset.view);}};});
['search','domain','entityType'].forEach(id=>$(id).addEventListener('input',()=>{state.focus=false;render();}));
$('reset').onclick=()=>{['search','domain','entityType'].forEach(id=>$(id).value='');state.focus=false;state.zoom=1;state.linkKind='all';state.keyKind='all';state.rule='all';state.category='Normalization';state.reviewStatus='open';state.compare.clear();render();};
function tableHTML(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">No matching results</td></tr>`}</tbody></table>`;}
function wireRefs(root=$('content')){root.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>selectTable(b.dataset.table));}
function openNeighborhood(table){state.selected=table;state.finding=null;state.focus=true;state.zoom=1;['search','domain','entityType'].forEach(id=>$(id).value='');if(innerWidth<=700)setSide(false);setView('map');}
function detail(){
 const t=byId.get(state.selected);if(!t){$('detail').innerHTML='<p class="muted">No entity selected</p>';return;}
 const finding=state.finding, links=outgoing(t),ins=incoming(t);
 $('inspectorTitle').textContent=finding?'Review evidence':'Entity inspector';
 $('detail').innerHTML=`<section><h2>${E(t.id.replaceAll('_','_\u200b'))}</h2><p class="muted">${E(t.className)}</p><div style="margin-top:8px">${badge(t.domain)}${badge(t.type)}</div></section><div class="detail-actions"><button id="focusEntity">${icon('Focus')}Relationships</button><button id="entityKeys">${icon('KeyRound')}Keys</button></div>${finding?findingDetail(finding):''}<dl class="facts"><dt>Primary key</dt><dd>${E(t.pk||'None recorded')}</dd><dt>Columns</dt><dd>${cols(t).length}</dd><dt>Declared FKs</dt><dd>${links.filter(l=>l.kind==='declared FK').length} outbound / ${ins.filter(l=>l.kind==='declared FK').length} inbound</dd><dt>Source</dt><dd>${E(t.file||data.source.file)}:${E(t.line)}</dd></dl><section><h3>Columns</h3><div class="detail-table">${tableHTML(['Column / flags','Type'],cols(t).map(c=>`<tr><td>${E(c.name.replaceAll('_','_\u200b'))}<br>${c.pk?badge('PK',true):''}${c.fk?badge('FK',true):''}${c.unique?badge('Unique'):''}${indexed(t,c)?badge('Index lead'):''}</td><td>${E(c.type)}<br><span class="muted">${c.nullable==='True'?'Nullable':c.nullable==='False'||c.pk?'Required':'Nullability implicit'}</span></td></tr>`))}</div></section><section><h3>Relationships (${links.length+ins.length})</h3>${[...links.map(l=>({l,dir:'to',id:l.target})),...ins.map(l=>({l,dir:'from',id:l.source}))].map(({l,dir,id})=>`<p style="margin:8px 0">${dir} ${ref(id)}<br><span class="muted">${E(l.column)} &rarr; ${E(l.targetColumn)} | ${E(l.kind)}</span></p>`).join('')||'<p class="muted">None recorded</p>'}</section><section><h3>Declared indexes &amp; constraints</h3>${t.indexes.map(i=>`<p>${badge(i.unique?'Unique index':'Index')} ${E(i.name)}<br><span class="muted">${E(i.columns.join(', '))}</span></p>`).join('')}${t.uniques.map(u=>`<p>${badge('Unique')} ${E(u.columns.join(', '))}</p>`).join('')}${t.checks.map(c=>`<p>${badge('Check')} ${E(c.definition)}</p>`).join('')}${!t.indexes.length&&!t.uniques.length&&!t.checks.length?'<p class="muted">No explicit declarations recorded</p>':''}</section><details><summary class="muted">Source &amp; scope</summary><p class="muted">${E(data.source.basis)}</p><p class="muted">Generated ${E(data.source.generated)}<br>Source SHA-256: ${E(data.source.sha256)}</p></details>`;
 $('focusEntity').onclick=()=>openNeighborhood(t.id);$('entityKeys').onclick=()=>{['domain','entityType'].forEach(id=>$(id).value='');$('search').value=t.id;state.keyKind='all';setView('keys');};wireRefs($('detail'));

function zoom(value,center=true){const stage=$('stage'),old=state.zoom;state.zoom=value;const cx=(stage.scrollLeft+stage.clientWidth/2)/old,cy=(stage.scrollTop+stage.clientHeight/2)/old;$('graph').style.width=graphSize.w*value+'px';$('graph').style.height=graphSize.h*value+'px';$('zoomValue').textContent=Math.round(value*100)+'%';if(center)stage.scrollTo(cx*value-stage.clientWidth/2,cy*value-stage.clientHeight/2);}
let mountedView=null;
function render(){if(mountedView&&mountedView!==state.view){window.BackendBuddyViews?.unmount();mountedView=null;}const tables=scoped();if(['fanout','columns','city','living','lens','diff','matrix','arcs','domains'].includes(state.view))renderExtension(tables);if(state.view==='map')renderMap(tables);if(state.view==='entities')renderEntities(tables);if(state.view==='keys')renderKeys(tables);if(state.view==='review')renderReview(tables);$('status').textContent=`${state.focus&&state.view==='map'?'Neighborhood':tables.length+' / '+data.tables.length+' entities'} | ${exportRows.length} ${state.view==='map'?'relationships':state.view==='review'?'review candidates':'index rows'} | ${data.links.filter(l=>l.kind==='declared FK').length} declared FKs total`;if(['fanout','columns','city','living','lens','diff','matrix','arcs','domains'].includes(state.view)){$('status').textContent=tables.length+' tables | '+(live?'Live read-only connection':'Snapshot only')+' | '+tables.filter(t=>typeof t.rowCount==='number').length+' known row counts';$('export').setAttribute('aria-label','Export schema snapshot');$('export').dataset.tip='Export schema snapshot';}else{$('export').setAttribute('aria-label','Export current view as CSV');$('export').dataset.tip='Export current view as CSV';}detail();if(state.finding&&$('reviewDecision'))$('reviewDecision').value=reviews[state.finding.id]||'open';}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){if(['fanout','columns','city','living','lens','diff','matrix','arcs','domains'].includes(state.view)){download(JSON.stringify(data,null,2),'schema-snapshot.json','application/json');return;}if(!exportRows.length){notify('No rows to export');return;}const names=Object.keys(exportRows[0]);const cell=v=>'"'+String(v??'').replace(/^[\s]*[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';download('\ufeff'+[names.map(cell).join(','),...exportRows.map(r=>names.map(k=>cell(r[k])).join(','))].join('\r\n'),`${data.project.key}-${state.view}.csv`,'text/csv;charset=utf-8');}
$('export').onclick=exportCSV;
function exportSVG(){const clone=$('graph').cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',graphSize.w);clone.setAttribute('height',graphSize.h);clone.removeAttribute('style');const originals=$('graph').querySelectorAll('*');clone.querySelectorAll('*').forEach((n,i)=>{const c=getComputedStyle(originals[i]);for(const prop of ['fill','stroke','stroke-width','stroke-dasharray','opacity','font-family','font-size','font-weight'])n.style.setProperty(prop,c.getPropertyValue(prop));});clone.style.background=getComputedStyle(document.documentElement).getPropertyValue('--bg');download(new XMLSerializer().serializeToString(clone),data.project.key+'-relational-map.svg','image/svg+xml');}
async function copySQL(sql){try{await navigator.clipboard.writeText(sql);notify('SQL copied');}catch{const range=document.createRange();range.selectNodeContents($('sql'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);notify('Clipboard unavailable; SQL selected');}}
document.addEventListener('pointerover',e=>{const b=e.target.closest('[data-tip]');if(!b)return;const r=b.getBoundingClientRect(),t=$('tooltip');t.textContent=b.dataset.tip;t.hidden=false;t.style.left=Math.max(8,Math.min(innerWidth-t.offsetWidth-8,r.left))+'px';t.style.top=Math.min(innerHeight-t.offsetHeight-8,r.bottom+6)+'px';});document.addEventListener('pointerout',()=>$('tooltip').hidden=true);

let live;
if(window.__SCHEMA_LIVE__ && location.protocol.startsWith('http')){
 const request=async(action,body,signal)=>{const response=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Schema-Token':window.__SCHEMA_LIVE__.token},body:JSON.stringify(body),signal});if(!response.ok){const error=await response.json();throw new Error(error.error||'Read-only request failed');}return response.json();};
 live={profile:async(body,signal)=>{const result=await request('profile',body,signal);data.tables=result.graph.tables;data.links=result.graph.links;byId.clear();data.tables.forEach(t=>byId.set(t.id,t));return result;},subtree:(body,signal)=>request('subtree',body,signal)};
}
window.schemaSnapshot=()=>structuredClone(data);
function renderExtension(tables){
 $('content').innerHTML='<div class="extension-host" id="extensionHost"></div>';
 if(!window.BackendBuddyViews){$('extensionHost').textContent='Extension bundle unavailable';return;}
 window.mountedView=state.view;window.BackendBuddyViews.mount($('extensionHost'),state.view,{graph:{...data,tables},onSelectTable:selectTable,onSelectTables:selectTables,live});
 exportRows=[];
}

setSide(state.side);hydrate();render();
const observer=new ResizeObserver(()=>{clearTimeout(drawTimer);drawTimer=setTimeout(()=>{if(state.view==='map')render();},100);});observer.observe($('workspace'));
})();
</script>
</body>
</html>
